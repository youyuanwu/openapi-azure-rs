[package]
name = "openapi-service-fabric"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "Service Fabric REST Client APIs allows management of Service Fabric clusters, applications and services."
# Override this license by providing a License Object in the OpenAPI.
license = "MIT"
edition = "2021"
repository.workspace = true
readme = "README.md"
documentation = "https://learn.microsoft.com/en-us/azure/service-fabric/service-fabric-overview"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]
