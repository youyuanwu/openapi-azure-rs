[package]
name = "openapi-service-fabric"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "Service Fabric REST Client APIs allows management of Service Fabric clusters, applications and services."
# Override this license by providing a License Object in the OpenAPI.
license = "MIT"
edition = "2021"
repository.workspace = true
readme = "README.md"
documentation = "https://learn.microsoft.com/en-us/azure/service-fabric/service-fabric-overview"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
rustls-tls = ["rustls"]
