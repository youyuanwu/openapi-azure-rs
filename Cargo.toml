[workspace]
resolver = "2"
members = [
  "openapi-service-fabric"
  , "openapi-azure-storage-blob"
  , "openapi-tests"]
package.edition = "2024"
package.authors = [ "youyuanwu@outlook.com" ]
package.repository = "https://github.com/youyuanwu/openapi-azure-rs.git"

[workspace.dependencies]
openapi-service-fabric = { path = "openapi-service-fabric" }
tokio = { version = "1.54.1", default-features = false, features = ["macros"] }